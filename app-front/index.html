<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Comentários</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <img src="img/logo.svg" alt="Logo" class="logo-img">
          <h1>Sistema de Comentários</h1>
        </div>
        <div class="header-stats">
          <span id="totalComments" class="stats-badge">0 comentários</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Formulário de Comentário -->
      <section class="comment-section">
        <div class="section-header">
          <h2>
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            Adicionar Comentário
          </h2>
        </div>
        
        <form id="commentForm" class="comment-form">
          <div class="form-row">
            <div class="form-group">
              <label for="email">
                <svg class="icon-small" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Email
              </label>
              <input 
                type="email" 
                id="email" 
                class="form-input" 
                placeholder="seu@email.com"
                required
              >
              <span class="error-message" id="emailError"></span>
            </div>
            
            <div class="form-group">
              <label for="content_id">
                <svg class="icon-small" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                Content ID
              </label>
              <input 
                type="text" 
                id="content_id" 
                class="form-input"
                placeholder="Ex: POST-001"
                required
              >
              <span class="error-message" id="contentIdError"></span>
            </div>
          </div>
          
          <div class="form-group">
            <label for="comment">
              <svg class="icon-small" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              Comentário
            </label>
            <textarea 
              id="comment" 
              class="form-textarea" 
              placeholder="Escreva seu comentário aqui..."
              rows="4"
              required
            ></textarea>
            <span class="error-message" id="commentError"></span>
            <div class="char-counter">
              <span id="charCount">0</span> / 500 caracteres
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <svg class="icon-small" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Enviar Comentário
          </button>
        </form>
      </section>

      <!-- Buscar Comentários -->
      <section class="search-section">
        <div class="section-header">
          <h2>
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            Buscar Comentários
          </h2>
        </div>
        
        <div class="search-bar">
          <input 
            type="text" 
            id="search_content_id" 
            class="search-input"
            placeholder="Digite o Content ID para buscar..."
          >
          <button onclick="loadComments()" class="btn btn-secondary" id="searchBtn">
            <svg class="icon-small" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            Buscar
          </button>
        </div>

        <!-- Filtros -->
        <div class="filters">
          <label class="filter-label">
            <input type="checkbox" id="sortByDate" onchange="handleSort()">
            Ordenar por data (mais recentes primeiro)
          </label>
        </div>
      </section>

      <!-- Lista de Comentários -->
      <section class="comments-list-section">
        <div id="commentsContainer" class="comments-container">
          <div class="empty-state" id="emptyState">
            <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>Nenhum comentário encontrado</p>
            <p class="empty-subtitle">Use o campo acima para buscar comentários por Content ID</p>
          </div>
          
          <ul id="commentsList" class="comments-list"></ul>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 Sistema de Comentários. Todos os direitos reservados.</p>
    </footer>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
